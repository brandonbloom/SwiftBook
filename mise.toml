[env]
SWIFTBOOK_HOME = "{{ config_root }}"

[hooks]
postinstall = "mise run deps"

[tasks.deps]
description = "Resolve Swift package dependencies"
run = "swift package resolve"

[tasks.build]
description = "Build all targets"
run = "swift build"

[tasks.test]
description = "Run the test suite"
run = "swift test"

[tasks.ci]
description = "Run everything that must pass before a change lands"
run = "scripts/ci"

[tasks.latency]
description = "Report edit-to-render latency on the zoo, per device"
run = "scripts/latency mac iphone"

[tasks.site-assets]
description = "Copy the website's figures from the zoo's references"
run = "scripts/site-assets"

[tasks.site-build]
description = "Build the website and documentation into .build/site"
run = "scripts/site-build"

[tasks.site-preview]
description = "Build the website and serve it at http://localhost:8000"
depends = ["site-build"]
run = "python3 -m http.server --directory .build/site 8000"
